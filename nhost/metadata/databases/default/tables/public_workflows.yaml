table:
  name: workflows
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_runs
          schema: public
  - name: steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_steps
          schema: public
  - name: triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_triggers
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
      set:
        created_by: X-Hasura-User-Id
      columns:
        - org_id
        - name
        - description
        - is_active
    comment: Role and tenancy are checked together. An editor in another organization fails the same expression a viewer does.
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
      allow_aggregations: true
    comment: Layer 1 read scoping.
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - description
        - is_active
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
      check:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
    comment: 'filter picks the rows that may be touched, check validates the row that results. Both are needed: without check, an update could move a workflow into another organization.'
delete_permissions:
  - role: user
    permission:
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
    comment: Deleting a workflow destroys its run history, so owners only.
