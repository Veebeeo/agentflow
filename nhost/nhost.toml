[global]


# Hasura resolves {{AGENTFLOW_FUNCTIONS_URL}} in actions.yaml, cron_triggers.yaml
# and the event triggers from this variable. Locally the functions container is
# reachable on the compose network as http://functions:3000/v1 . In Nhost Cloud
# set it to https://<subdomain>.functions.<region>.nhost.run/v1 .
[[global.environment]]
name = 'AGENTFLOW_FUNCTIONS_URL'
value = '{{ secrets.AGENTFLOW_FUNCTIONS_URL }}'

# Shared secret between Hasura and the functions. Every handler rejects a
# request that does not carry it, so nobody can call the executor directly.
[[global.environment]]
name = 'AGENTFLOW_FUNCTIONS_SECRET'
value = '{{ secrets.AGENTFLOW_FUNCTIONS_SECRET }}'

# 32-byte base64 key used to encrypt org_secrets values at rest.
[[global.environment]]
name = 'AGENTFLOW_SECRETS_KEY'
value = '{{ secrets.AGENTFLOW_SECRETS_KEY }}'

[[global.environment]]
name = 'LLM_PROVIDER'
value = '{{ secrets.LLM_PROVIDER }}'

[[global.environment]]
name = 'LLM_API_KEY'
value = '{{ secrets.LLM_API_KEY }}'


[[global.environment]]
name = 'LLM_MODEL'
value = '{{ secrets.LLM_MODEL }}'

[[global.environment]]
name = 'SLACK_WEBHOOK_URL'
value = '{{ secrets.SLACK_WEBHOOK_URL }}'

# Comma-separated hostname suffixes the http_request step may call.
# Empty means "anything public", which is still guarded by the SSRF checks in
# functions/_lib/safe-fetch.ts. Set it in production.
[[global.environment]]
name = 'HTTP_ALLOWED_HOSTS'
value = '{{ secrets.HTTP_ALLOWED_HOSTS }}'

[[global.environment]]
name = 'AGENTFLOW_METADATA_URL'
value = '{{ secrets.AGENTFLOW_METADATA_URL }}'

[hasura]
version = 'v2.48.10-ce'
adminSecret = '{{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}'
webhookSecret = '{{ secrets.NHOST_WEBHOOK_SECRET }}'

[[hasura.jwtSecrets]]
type = 'RS256'
key = '{{ secrets.NHOST_JWT_PUBLIC_KEY }}'
signingKey = '{{ secrets.NHOST_JWT_PRIVATE_KEY }}'
kid = '{{ secrets.NHOST_JWT_KID }}'

[hasura.settings]
corsDomain = ['*']
devMode = true
enableAllowList = false
enableConsole = true
enableRemoteSchemaPermissions = false
enabledAPIs = ['metadata', 'graphql', 'pgdump', 'config']
inferFunctionPermissions = true
liveQueriesMultiplexedRefetchInterval = 1000
stringifyNumericTypes = false

[hasura.logs]
level = 'warn'

[hasura.events]
httpPoolSize = 100

[functions]
[functions.node]
version = 22

[auth]
version = '0.49.1'

[auth.elevatedPrivileges]
mode = 'disabled'

[auth.redirections]
clientUrl = 'https://agentflow-wheat.vercel.app'
allowedUrls = ['https://agentflow-wheat.vercel.app', 'http://localhost:3000']

[auth.signUp]
enabled = true
disableNewUsers = false
disableAutoSignup = false

[auth.user]
[auth.user.roles]
default = 'user'
allowed = ['user', 'me']

[auth.user.locale]
default = 'en'
allowed = ['en']

[auth.user.gravatar]
enabled = true
default = 'blank'
rating = 'g'

[auth.user.email]

[auth.user.emailDomains]

[auth.session]
[auth.session.accessToken]
expiresIn = 900

[auth.session.refreshToken]
expiresIn = 2592000

[auth.method]
[auth.method.anonymous]
enabled = false

[auth.method.emailPasswordless]
enabled = false

[auth.method.otp]
[auth.method.otp.email]
enabled = false

[auth.method.emailPassword]
hibpEnabled = false
emailVerificationRequired = false
passwordMinLength = 9

[auth.method.smsPasswordless]
enabled = false

[auth.method.oauth]
[auth.method.oauth.apple]
enabled = false

[auth.method.oauth.azuread]
tenant = 'common'
enabled = false

[auth.method.oauth.bitbucket]
enabled = false

[auth.method.oauth.discord]
enabled = false

[auth.method.oauth.entraid]
tenant = 'common'
enabled = false

[auth.method.oauth.facebook]
enabled = false

[auth.method.oauth.github]
enabled = false

[auth.method.oauth.gitlab]
enabled = false

[auth.method.oauth.google]
enabled = false

[auth.method.oauth.linkedin]
enabled = false

[auth.method.oauth.spotify]
enabled = false

[auth.method.oauth.strava]
enabled = false

[auth.method.oauth.twitch]
enabled = false

[auth.method.oauth.twitter]
enabled = false

[auth.method.oauth.windowslive]
enabled = false

[auth.method.oauth.workos]
enabled = false

[auth.method.webauthn]
enabled = false

[auth.method.webauthn.attestation]
timeout = 60000

[auth.totp]
enabled = false

[auth.oauth2Provider]
enabled = false

[auth.oauth2Provider.accessToken]
expiresIn = 900

[auth.oauth2Provider.refreshToken]
expiresIn = 2592000

[auth.oauth2Provider.clientIdMetadataDocument]
enabled = false

[auth.misc]
concealErrors = false

[auth.rateLimit]
[auth.rateLimit.emails]
limit = 10
interval = '1h'

[auth.rateLimit.sms]
limit = 10
interval = '1h'

[auth.rateLimit.bruteForce]
limit = 10
interval = '5m'

[auth.rateLimit.signups]
limit = 10
interval = '5m'

[auth.rateLimit.global]
limit = 100
interval = '1m'

[auth.rateLimit.oauth2Server]
limit = 100
interval = '5m'

[postgres]
version = '14.20-20251217-1'

[postgres.resources]
[postgres.resources.storage]
capacity = 1

[provider]

[storage]
version = '0.14.0'

[observability]
[observability.grafana]
adminPassword = '{{ secrets.GRAFANA_ADMIN_PASSWORD }}'

[observability.grafana.alerting]
enabled = false

[observability.grafana.contacts]
